<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fondo con los colores oscuros de la app (Brand Dark & Secondary) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a64"/>
      <stop offset="100%" stop-color="#1e2c31"/>
    </linearGradient>

    <!-- Gradiente para el cuerpo de la Caja Chica (Brand Primary & Secondary) -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa1af"/>
      <stop offset="25%" stop-color="#547c8a"/>
      <stop offset="100%" stop-color="#324952"/>
    </linearGradient>

    <!-- Gradiente Dorado para la moneda de soles (S/.) -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Sombra para dar profundidad y relieve a la caja y moneda -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f171a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Contenedor redondeado tipo App Icon (Contraste perfecto en pestañas claras y oscuras) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#7aa1af" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Asa metálica de la Caja Chica -->
  <path d="M25 24 V18 C25 14.8 27.8 13 32 13 C36.2 13 39 14.8 39 18 V24" fill="none" stroke="#a2c0cb" stroke-width="3" stroke-linecap="round"/>

  <!-- Moneda dorada (S/.) ingresando a la ranura -->
  <g filter="url(#shadow)">
    <circle cx="32" cy="19" r="10.5" fill="url(#coinGrad)"/>
    <circle cx="32" cy="19" r="8.5" fill="none" stroke="#fef3c7" stroke-width="0.9" stroke-dasharray="2 1.5"/>
    <text x="32" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="-0.5">S/</text>
  </g>

  <!-- Ranura / Bisel superior de la Caja -->
  <rect x="8" y="24" width="48" height="6" rx="3" fill="#648c9b" filter="url(#shadow)"/>
  <rect x="23" y="25.5" width="18" height="2" rx="1" fill="#1e2c31" opacity="0.6"/>

  <!-- Cuerpo principal de la Caja Chica de caudales -->
  <path d="M10 28 H54 V46 C54 50.5 50.5 54 46 54 H18 C13.5 54 10 50.5 10 46 Z" fill="url(#boxGrad)"/>

  <!-- Cerradura / Placa frontal de seguridad -->
  <rect x="24" y="34" width="16" height="12" rx="3" fill="#1e2c31" stroke="#7aa1af" stroke-width="1.2"/>
  
  <!-- Ojo de cerradura en dorado brillante -->
  <circle cx="32" cy="38.5" r="2.2" fill="#fbbf24"/>
  <polygon points="31,39.5 33,39.5 32.6,43 31.4,43" fill="#fbbf24"/>

  <!-- Remaches laterales metálicos de seguridad -->
  <circle cx="16" cy="41" r="1.5" fill="#a2c0cb" opacity="0.85"/>
  <circle cx="48" cy="41" r="1.5" fill="#a2c0cb" opacity="0.85"/>
</svg>